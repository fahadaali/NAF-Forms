# إعداد Cloudflare Workers لتطبيق ناف (عبر @opennextjs/cloudflare)
# استبدل القيم بين <> بمعرّفاتك بعد إنشاء الموارد (انظر DEPLOY.md).
name = "naf-forms"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]
main = ".open-next/worker.js"

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# قاعدة بيانات D1
[[d1_databases]]
binding = "DB"
database_name = "naf-forms"
database_id = "<D1_DATABASE_ID>"

# تخزين الملفات R2
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "naf-forms-uploads"

# مساحة KV للدخول الموحّد: جلسة المنصة (sess:) وذاكرة المفاتيح (jwks:).
#
# ولا مفتاح `st:` للحالة العابرة: المركز هو من يولّد `state` ويخزّنه مع الرمز
# ويطابقه عند المبادلة، فليس للمنصة ما تخزّنه قبل التحويل.
#
# المعرّف يُحقن عند النشر كما يُحقن معرّف D1 — سير النشر ينشئ المساحة إن لم
# تكن ويضع معرّفها هنا، فلا يُلتزَم معرّف حقيقي في الملف. وللإنشاء يدوياً:
#   wrangler kv namespace create AUTH_KV
[[kv_namespaces]]
binding = "AUTH_KV"
id = "<AUTH_KV_NAMESPACE_ID>"

# متغيّرات عامة (غير سرّية). الأسرار تُضاف عبر: wrangler secret put <NAME>
[vars]
FIRST_ADMIN_EMAIL = "fahad2ao@gmail.com"
# R2_PUBLIC_URL = "https://<your-r2-public-domain>"

# ===== الدخول الموحّد (naf-id) =====
# هذان المتغيّران وحدهما ما يختلف بين منصة وأخرى، وليسا سرّين.
#
# المعرّف حسّاس لحالة الأحرف ولا يُطبَّع إلى حروف صغيرة في أي طرف: هو المفتاح
# الأساسي في جدول المنصات بالمركز، وهو قيمة `aud` في كل رمز موقّع، والمقارنة
# به عند هذه المنصة حرفية. فـ`naf-forms` ليست `NAF-Forms`.
PLATFORM_ID = "NAF-Forms"

# يُقارن بـ`iss` مقارنةً حرفية — بلا شرطة مائلة أخيرة، والإعداد يرفض البدء
# بواحدة بدل أن يحذفها صامتاً فيخفي خطأً يظهر رفضاً بلا سبب مقروء.
AUTH_ISSUER = "https://naf-id.pages.dev"

# الدور الافتراضي لأول دخول. المصادقة مركزية والصلاحيات موزّعة: المركز يقول
# من الزائر، والدور داخل هذه المنصة يقرّره جدولها وحده.
DEFAULT_ROLE = "viewer"

# السرّ لا يُكتب هنا ولا في الكود ولا في سجلّ خطأ:
#   wrangler secret put AUTH_CLIENT_SECRET
